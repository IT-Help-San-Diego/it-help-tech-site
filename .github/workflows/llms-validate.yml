name: Validate llms-full.txt generation

on:
  pull_request:
    branches: [main]
    paths:
      - "content/**"
      - "infra/llms/**"
      - "infra/citations/**"
      - "data/**"
      - "config.toml"
      - "infra/cloudfront/redirects.json"
      - "scripts/stamp-withdrawal.sh"
      - ".github/workflows/llms-validate.yml"

# Least-privilege token: this workflow only reads the repo and uploads an
# artifact. Artifact upload uses the workflow run scope, not GITHUB_TOKEN.
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"

      - name: Run llms-full generator
        run: node infra/llms/build-llms-full.mjs

      - name: Check field-note citations data is current
        # data/field-note-citations.json is derived from each note's reference
        # list; a content change that edits references must regenerate it.
        run: node infra/citations/extract-citations.mjs --check

      - name: Check the withdrawal carries one identifier everywhere
        # The register entry, its heading, the /use-policy/ anchor and the five
        # redirect rows must all name the same entry, or all still be unstamped.
        run: bash scripts/stamp-withdrawal.sh --check

      - name: Show byte count and section structure
        run: |
          echo "Generated $(wc -c < build/llms-full.txt) bytes"
          echo ""
          echo "=== Section structure ==="
          grep -E "^#{1,3} " build/llms-full.txt

      - name: Upload generated file as artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: llms-full-txt-preview
          path: build/llms-full.txt
          retention-days: 14
