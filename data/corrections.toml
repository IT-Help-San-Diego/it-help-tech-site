id = "C-20261114-02"
status = "published"
kind = "withdrawal"
severity = "Material"
logged = "2026-11-14"
work = "Bug-Bounty Programs Are a Corporate-Controlled Casino"
heading = "C-20261114-02 · A field note on bug bounties and hosted-storefront security · withdrawn 14 November 2026"
entry = """
*Bug-Bounty Programs Are a Corporate-Controlled Casino*, a field note. Published 19 June 2026. Removed from this site on 14 November 2026. Withdrawn by the author.

The note stated that Square Online storefronts do not force an HTTPS redirect and do not send HSTS. Measured on 13 November 2026 across 38 storefronts on the platform's own subdomain addresses, both protections were present on all 38: HTTP redirected to HTTPS, and HSTS was sent with a 90-day max-age.

**This entry does not establish what was true when the note was written.** The note was written in June 2026 and relied on weekly scan reports of one storefront, received since mid-2025. What can be said is that the claim does not hold now, and that stating a measurement of another party's configuration as a standing property of that party was the wrong form for the finding.

The note's other two findings did hold in the same measurement: none of the 38 sent a Content-Security-Policy header or an X-Frame-Options header. Bugcrowd, a bounty platform the note cited, rates the absence of each header at P5 in its published Vulnerability Rating Taxonomy (version 1.19.1), the informational tier that earns no reward. On their own, those two findings do not carry the argument the note made.

The note was written by a customer of the platform it discussed. It has been withdrawn rather than revised, because what would have remained after correction did not support publishing.
"""

