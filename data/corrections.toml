# Corrections register: the single source for every correction on this site.
#
# Each record renders twice: as a dated notice at the top of the work
# (templates/partials/_correction_notice.html, included by page.html) and as
# an entry on /corrections/ (templates/shortcodes/corrections_index.html).
# The Article JSON-LD of the work also carries it as a schema.org
# CorrectionComment (templates/partials/_jsonld.html).
#
# The index is also rendered into /llms-full.txt, by a second renderer:
# infra/llms/build-llms-full.mjs (renderCorrectionsIndex). A field added to
# the index template has to be added there too.
#
# Rules (see content/corrections.md for the public statement):
# - id is C-YYYYMMDD-NN, the date the correction was logged; never reused.
# - severity is "Material" or "Substantive". Housekeeping fixes get no record.
# - A record carries either the field set (published, wrong, now, propagated)
#   or `heading` and `entry`, the exact text of its entry. Reference
#   corrections use one record per note, in entry form, with `work_path` and a
#   one-sentence `summary` for the note's structured data. A withdrawal has no
#   `work_path`, because the work is no longer published.
# - `notice` is optional and renders a dated block above the work's body. By
#   the owner's decision a corrected note carries no such block: the entry on
#   /corrections/ is the record.
# - status = "published" only once the fix itself has landed in the same
#   change. Anything else ("pending") renders nowhere.
# - Never delete the original claim: quote it in `published`.
# - `amended` is optional. A change to a published record is said there,
#   quoting what the record said before, with the Los Angeles day of the
#   change. It renders last, under "Changes to this entry". A record in
#   entry form says the same at the end of `entry`.
# - A record describes a text and a fact, never a person. No clients, no
#   third-party individuals, no state of mind, no internal process material.
# - A corrected file that keeps its URL (a .bib, a .pdf) is linked with a
#   version query (?v=YYYYMMDD), so no browser's cached copy can answer for it.
# - `logged` and `fixed` are Los Angeles days. `original_date` is the day the
#   work gives for itself; where it gives none, the record says which clock.
# - A date from someone else's record of their own event (a Wayback Machine
#   capture, a search result read) keeps that record's clock and is labelled,
#   as in "7 November 2026 (UTC)". Whose event it is decides whose clock.
# - Dates are YYYY-MM-DD strings. `fixed` is the date the corrected text is
#   published on this site.

