# Corrections register: the single source for every correction on this site.
#
# Each record renders twice: as a dated notice at the top of the work
# (templates/partials/_correction_notice.html, included by page.html) and as
# an entry on /corrections/ (templates/shortcodes/corrections_index.html).
# The Article JSON-LD of the work also carries it as a schema.org
# CorrectionComment (templates/partials/_jsonld.html).
#
# Rules (see content/corrections.md for the public statement):
# - id is C-YYYYMMDD-NN, the date the correction was logged; never reused.
# - severity is "Material" or "Substantive". Housekeeping fixes get no record.
# - A correction made in place carries the fields below and a `notice`. A
#   withdrawal carries `heading` and `entry` instead (the exact text of its
#   entry) and no `notice`, because the work is no longer published.
# - status = "published" only once the fix itself has landed in the same
#   change. Anything else ("pending") renders nowhere.
# - Never delete the original claim: quote it in `published`.
# - A record describes a text and a fact, never a person. No clients, no
#   third-party individuals, no state of mind, no internal process material.
# - A corrected file that keeps its URL (a .bib, a .pdf) is linked with a
#   version query (?v=YYYYMMDD), so no browser's cached copy can answer for it.
# - Dates are YYYY-MM-DD strings. `fixed` is the date the corrected text is
#   published on this site.

[[correction]]
# The withdrawal of "The Real Bot Hasn't Been Built Yet". The identifier and
# the date are stamped on the day the withdrawal goes live, not before:
# run scripts/stamp-withdrawal.sh YYYY-MM-DD. The build stops while the
# placeholders remain.
id = "C-YYYYMMDD-01"
status = "published"
kind = "withdrawal"
severity = "Material"
logged = "YYYY-MM-DD"
work = "The Real Bot Hasn't Been Built Yet"
heading = "C-YYYYMMDD-01 · The Real Bot Hasn't Been Built Yet · withdrawn [DEPLOY DATE]"
entry = """
Published 2026, last revised 26 April 2026. Withdrawn by the author.

**Why.** The note was written before the systems it describes changed, and its argument is carried further, and more carefully, in *The Belief Machine: How Human Identity Defense, AI Sycophancy, and Unaudited Targeting Systems Became One Problem* ([10.2139/ssrn.6722059](https://doi.org/10.2139/ssrn.6722059)). Read that instead.

**It also carried a citation error, and this is the article where that matters most.** Its reference 12 cited the author's own long-form manifesto with a DOI that resolves to a different work, a software deposit. The manifesto was never deposited, so there was no correct identifier to substitute.

**If you imported this page's BibTeX file, you hold a bad reference.** Delete the entry with key **`balboa2026realbot`**, which carries `doi = {10.5281/zenodo.19468134}`. That DOI resolves, which is why no link checker flags it, but it points at a software deposit titled *DNS Tool: Domain Security Audit Platform*, not at this work.

The note argued that an unverifiable citation is the floor that fails first. It was right, and it did not hold itself to that floor. That is the reason this entry exists rather than a quiet deletion.
"""
