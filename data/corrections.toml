entry = """
[Don't Guess Wrong](/field-notes/apple-sends-you-to-ijail/). 4 of this note's references did not match the records they cite. They were corrected on 13 November 2026. Each is given below as it was, then as it reads now.

**Reference 8** said:

> Apple Inc. *If you forgot your Apple Account password.* Apple Support, updated April 21, 2026. <https://support.apple.com/en-us/102656>

It now says:

> Apple Inc. *If you forgot your password and can't sign in to your Apple Account.* Apple Support, updated October 5, 2026. <https://support.apple.com/en-us/102656> (titled *If you forgot your Apple Account password* in the April 21, 2026 revision cited in the text, archived at <https://web.archive.org/web/20260426031447/https://support.apple.com/en-us/102656>).

**Reference 9** said:

> Apple Inc. *How to use account recovery when you can't reset your Apple Account password.* Apple Support, updated December 5, 2025. <https://support.apple.com/en-us/118574> (verbatim quote source for "it might take several days or longer").

It now says:

> Apple Inc. *What to expect during account recovery.* Apple Support, updated October 5, 2026. <https://support.apple.com/en-us/118574> (titled *How to use account recovery when you can't reset your Apple Account password* in the December 5, 2025 revision, which is the verbatim quote source for "it might take several days or longer"; that revision is archived at <https://web.archive.org/web/20251206115233/https://support.apple.com/en-us/118574>).

**Reference 10** said:

> Apple Inc. *Apple Platform Security — Passcodes and passwords.* <https://support.apple.com/guide/security/passcodes-and-passwords-sec20230a10d/web> (canonical published source for the iPhone passcode-escalation table and the Erase Data 10-attempt threshold; the simplified Apple Support article, updated January 14, 2026, is at <https://support.apple.com/en-us/119586>, formerly catalogued as `HT204060`).

It now says:

> Apple Inc. *Apple Platform Security — Passcodes and passwords.* <https://support.apple.com/guide/security/passcodes-and-passwords-sec20230a10d/web> (canonical published source for the iPhone passcode-escalation table and the Erase Data 10-attempt threshold; the simplified Apple Support article, updated May 13, 2026, is at <https://support.apple.com/en-us/119586>, formerly catalogued as `HT204060`).

**Reference 11** said:

> Google. *How Google authenticates users* / risk-based sign-in challenges. Google Safety Center. <https://safety.google/intl/en_us/safety/authentication/>

It now says:

> Google. *Authentication Tools for Secure Sign-In.* Google Safety Center. <https://safety.google/intl/en_us/safety/authentication/>

**A sentence in the note** said:

> The **sign-in path** is risk-based. Rather than counting attempts to a fixed number, Google's authentication system evaluates each sign-in against a model of expected behavior — same device? same network? same time of day? known location? — and escalates challenges proportionally (reference 11).

It now says:

> The **sign-in path** is risk-based. Google's Safety Center gives an overview of the sign-in tools it offers, such as passkeys and 2-Step Verification (reference 11), and Google has said that when it detects a suspicious sign-in attempt, for example from a new location or device, it asks for additional proof that it is really you (reference 12).

A reference was added for it:

> Thomas, K., & Moscicki, A. *New research: How effective is basic account hygiene at preventing hijacking.* Google Online Security Blog, May 17, 2019. <https://security.googleblog.com/2019/05/new-research-how-effective-is-basic.html>

The reference numbers in this entry were corrected on 13 November 2026 to match the numbers the note displays. As first published, the entry gave references 8 and 9 in each other's place, and gave the added reference as 13. The note displays it as 12.
"""

